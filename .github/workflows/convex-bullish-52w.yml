name: Convex Bullish 52W Scan

on:
  schedule:
    # 北京时间工作日 17:30（UTC 09:30）
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # 禁止并发运行，避免两个扫描同时向 main 推送
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run convex bullish 52W scan
        env:
          PYTHONPATH: .
        run: python instock/job/convex_bullish_52w_daily_job.py

      - name: Commit daily report and stock list
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/

          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit -m "Auto update daily convex bullish 52W stock list"

          # 扫描期间如果 main 有新提交，先同步远端再推送，避免 non-fast-forward
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
