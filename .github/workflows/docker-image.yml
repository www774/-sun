name: Docker Image CI

# 已暂停自动构建，避免影响股票量化扫描工作流。
# 如以后需要 Docker 构建，可在 Actions 中手动运行。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --file Dockerfile --tag my-image-name:latest .
