name: Daily Stock Analysis

on:
  schedule:
    # 北京时间每天17:30运行（UTC 09:30）
    - cron: "30 9 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r 要求.txt

      - name: Run stock analysis
        run: |
          python 主程序.py

      - name: Save results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto update stock analysis" || exit 0
          git push
